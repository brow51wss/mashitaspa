name: Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'

      # Production dependencies only: lint tooling (devDependencies) never ships to users.
      - name: Run npm audit (production)
        run: npm audit --omit=dev --audit-level=high
